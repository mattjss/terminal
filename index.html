<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>terminal</title>
<style>
  :root { --sz: 422px; }
  @media (min-width: 1440px) { :root { --sz: 576px; } }
  @media (max-width: 480px)  { :root { --sz: 322px; } }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background: #000;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
  }

  #wrap {
    display: flex; flex-direction: column; align-items: center; gap: 20px;
  }

  #terminal {
    width: var(--sz); height: var(--sz);
    background: #080808;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.06);
    display: flex; flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  #body {
    flex: 1;
    padding: 36px 32px 24px;
    display: flex; flex-direction: column; justify-content: center;
    overflow: hidden;
  }

  #output {
    font-size: 10px;
    line-height: 2.0;
    color: #c0c0c0;
    width: fit-content;
    min-width: 240px;
    margin: 0 auto;
  }

  .line { display: block; }

  .p  { color: #484848; }
  .v  { color: #f97316; }
  .m  { color: #686868; }
  .d  { color: #484848; }
  .g  { color: #4ade80; }
  .mk { color: #f97316; }

  .cursor {
    display: inline-block;
    width: 5px; height: 12px;
    background: #f97316;
    vertical-align: text-bottom;
    margin-left: 2px;
    animation: blink 1.0s step-end infinite;
  }

  @keyframes blink {
    0%, 49%  { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  #meta {
    font-size: 10px;
    letter-spacing: 0.04em; text-transform: uppercase;
    color: rgba(255,255,255,0.18);
    font-family: 'Geist Mono', 'Menlo', monospace;
  }
</style>
</head>
<body>

<div id="wrap">
  <div id="terminal">
    <div id="body">
      <div id="output"></div>
    </div>

  </div>
  <div id="meta">terminal</div>
</div>

<script>
(() => {
  const out  = document.getElementById('output');
  const meta = document.getElementById('meta');
  let   actx = null;

  const ac = () => {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    return actx;
  };

  // Keystroke: short square blip
  function keyClick() {
    try {
      const c = ac(), osc = c.createOscillator(), g = c.createGain();
      osc.type = 'square'; osc.frequency.value = 600 + Math.random() * 200;
      osc.connect(g); g.connect(c.destination);
      g.gain.setValueAtTime(0.06, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 0.018);
      osc.start(); osc.stop(c.currentTime + 0.02);
    } catch (_) {}
  }

  // Line reveal: quiet tick
  function blip() {
    try {
      const c = ac(), osc = c.createOscillator(), g = c.createGain();
      osc.type = 'square'; osc.frequency.value = 440;
      osc.connect(g); g.connect(c.destination);
      g.gain.setValueAtTime(0.04, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 0.02);
      osc.start(); osc.stop(c.currentTime + 0.022);
    } catch (_) {}
  }

  // Processing: silent
  function processPulse() {}

  // Success: classic terminal BEL — two clean tones
  function successChime() {
    try {
      const c = ac();
      [[880, 0, 0.12, 0.15], [1108, 0.18, 0.10, 0.18]].forEach(([hz, delay, vol, decay]) => {
        const osc = c.createOscillator(), g = c.createGain();
        osc.type = 'sine'; osc.frequency.value = hz;
        osc.connect(g); g.connect(c.destination);
        const t = c.currentTime + delay;
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
        osc.start(t); osc.stop(t + decay + 0.01);
      });
    } catch (_) {}
  }

  const wait = ms => new Promise(r => setTimeout(r, ms));

  function addLine(html = '') {
    const el = document.createElement('span');
    el.className = 'line'; el.innerHTML = html;
    out.appendChild(el);
    return el;
  }

  function mkPrompt(user = 'matt') {
    const el  = document.createElement('span'); el.className = 'line';
    const pr  = document.createElement('span'); pr.className = 'p'; pr.textContent = user + ' › ';
    const cmd = document.createElement('span');
    const cur = document.createElement('span'); cur.className = 'cursor';
    el.appendChild(pr); el.appendChild(cmd); el.appendChild(cur);
    out.appendChild(el);
    return { cmd, cur };
  }

  async function type(cmdEl, text) {
    for (const ch of text) {
      cmdEl.textContent += ch;
      keyClick(0.18 + Math.random() * 0.08);
      await wait(46 + Math.random() * 62);
    }
  }

  // Braille spinner — inverse pattern: rotating dark gap through a full block
  const SPIN = ['⣾','⣽','⣻','⢿','⡿','⣟','⣯','⣷'];

  async function run() {
    out.innerHTML = '';

    await wait(460);
    const { cmd, cur } = mkPrompt('matt');
    await wait(700);

    await type(cmd, 'reserve dinner tonight');
    keyClick(0.28);
    await wait(140);
    cur.remove();

    addLine('<span class="v">House of Prime Rib</span>  <span class="d">0.8mi · Van Ness</span>');
    blip();
    await wait(250);

    addLine('<span class="mk">—</span> <span class="m">why</span>      <span class="v">no red meat this week</span>  <span class="d">(0 / 1 allowed)</span>');
    blip();
    await wait(190);

    addLine('<span class="mk">—</span> <span class="m">table</span>    <span class="v">window · 8:00pm · 2 seats</span>');
    blip();
    await wait(190);

    addLine('<span class="mk">—</span> <span class="m">budget</span>   <span class="v">~$110pp</span>  <span class="d">within your range</span>');
    blip();
    await wait(340);

    const resLine = addLine('');
    const resSpan = document.createElement('span'); resLine.appendChild(resSpan);
    let si = 0;
    resSpan.innerHTML = `<span class="v">${SPIN[si]}</span> reserving`;

    const spinner = setInterval(() => {
      si = (si + 1) % SPIN.length;
      resSpan.innerHTML = `<span class="v">${SPIN[si]}</span> reserving`;
      processPulse();
    }, 100);

    await wait(3000);
    clearInterval(spinner);

    resLine.innerHTML = '<span class="g">confirmed</span>  8:00pm · table for 2  <span class="d">2.1s</span>';
    successChime();

    await wait(200);
    addLine('view reservation  <span class="d">#R-4829 · Prime Rib</span>');
    blip();

    await wait(500);
    mkPrompt('matt');

    await wait(2800);
    run();
  }

  document.addEventListener('click', () => ac(), { once: true });

  run();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>terminal</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg:       #0b0b0b;
    --surface:  #111111;
    --border:   #1d1d1d;
    --text:     #c2c2c2;
    --muted:    #888888;
    --dim:      #4a4a4a;
    --prompt:   #666666;
    --orange:   #c97d42;
    --green:    #5cbd68;
    --progress: #4d9eff;
  }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'SF Mono', ui-monospace, 'Fira Mono', 'Menlo', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .page-label {
    position: fixed;
    top: 26px;
    left: 32px;
    pointer-events: none;
    user-select: none;
  }
  .page-label .year {
    display: block;
    font-size: 10.5px;
    color: #363636;
    letter-spacing: 0.05em;
    line-height: 1.6;
  }
  .page-label .name {
    display: block;
    font-size: 12.5px;
    color: #454545;
    letter-spacing: 0.02em;
    line-height: 1.5;
  }

  .stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .terminal {
    width: 572px;
    height: 472px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .terminal-body {
    flex: 1;
    padding: 44px 36px 28px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    overflow: hidden;
  }

  .output {
    font-size: 13px;
    line-height: 1.85;
  }

  .line { display: block; }

  .p  { color: var(--prompt); }
  .o  { color: var(--orange); }
  .g  { color: var(--green); }
  .m  { color: var(--muted); }
  .d  { color: var(--dim); }

  .cursor {
    display: inline-block;
    width: 6px;
    height: 14px;
    background: var(--text);
    vertical-align: text-bottom;
    margin-left: 1px;
    animation: blink 1.1s step-end infinite;
  }

  @keyframes blink {
    0%, 49%  { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  .progress-track {
    height: 2px;
    flex-shrink: 0;
    background: transparent;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: var(--progress);
  }
</style>
</head>
<body>

<div class="page-label">
  <span class="year">2025</span>
  <span class="name">terminal</span>
</div>

<div class="stage">
  <div class="terminal">
    <div class="terminal-body">
      <div class="output" id="output"></div>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>
</div>

<script>
(() => {
  const out  = document.getElementById('output');
  const fill = document.getElementById('progressFill');
  let   ctx  = null;

  const ac = () => {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    return ctx;
  };

  function tick(freq = 900, dur = 0.03, vol = 0.05) {
    try {
      const c = ac(), osc = c.createOscillator(), g = c.createGain();
      osc.connect(g); g.connect(c.destination);
      osc.type = 'square';
      osc.frequency.value = freq;
      g.gain.setValueAtTime(vol, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
      osc.start(); osc.stop(c.currentTime + dur);
    } catch (_) {}
  }

  function chime() {
    try {
      const c = ac();
      [523, 659, 784].forEach((hz, i) => {
        const osc = c.createOscillator(), g = c.createGain();
        osc.connect(g); g.connect(c.destination);
        osc.type = 'sine'; osc.frequency.value = hz;
        const t = c.currentTime + i * 0.11;
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.09, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.26);
        osc.start(t); osc.stop(t + 0.28);
      });
    } catch (_) {}
  }

  const wait = ms => new Promise(r => setTimeout(r, ms));

  function addLine(html = '') {
    const el = document.createElement('span');
    el.className = 'line';
    el.innerHTML = html;
    out.appendChild(el);
    return el;
  }

  function mkPrompt(user = 'matt') {
    const el  = document.createElement('span');
    el.className = 'line';
    const pr  = document.createElement('span');
    pr.className = 'p';
    pr.textContent = user + ' % ';
    const cmd = document.createElement('span');
    const cur = document.createElement('span');
    cur.className = 'cursor';
    el.appendChild(pr); el.appendChild(cmd); el.appendChild(cur);
    out.appendChild(el);
    return { cmd, cur };
  }

  async function type(cmdEl, text) {
    for (const ch of text) {
      cmdEl.textContent += ch;
      tick(700 + Math.random() * 400, 0.025, 0.042);
      await wait(50 + Math.random() * 60);
    }
  }

  const SPIN = ['⠋','⠙','⠹','⠸','⠼','⠴','⠦','⠧','⠇','⠏'];

  async function run() {
    out.innerHTML = '';
    fill.style.transition = 'none';
    fill.style.width = '0%';
    fill.offsetWidth; // force reflow

    await wait(460);

    const { cmd, cur } = mkPrompt('matt');
    await wait(680);

    await type(cmd, 'swap 12h sleep btc');
    await wait(130);
    cur.remove();

    addLine('Swap 12h SLEEP for ~0.02856 BTC');
    tick(560, 0.04, 0.038);
    await wait(260);

    addLine('• <span class="m">Rate:</span> <span class="o">1h SLEEP</span> <span class="d">= <span class="o">0.00238 BTC</span> (via Terminal)</span>');
    tick(560, 0.04, 0.038);
    await wait(200);

    addLine('• <span class="m">Network fee:</span> $0.69 <span class="o">(0.00242h SLEEP)</span>');
    tick(560, 0.04, 0.038);
    await wait(200);

    addLine('• <span class="m">Slippage:</span> 0.5% <span class="d">(default)</span>');
    tick(560, 0.04, 0.038);
    await wait(360);

    const swapLine = addLine('');
    const swapSpan = document.createElement('span');
    swapLine.appendChild(swapSpan);
    swapSpan.textContent = '⠸ Swapping...';

    let fi = 0;
    const spinner = setInterval(() => {
      fi = (fi + 1) % SPIN.length;
      swapSpan.textContent = SPIN[fi] + ' Swapping...';
    }, 80);

    const DUR = 3000;
    await wait(16);
    fill.style.transition = `width ${DUR}ms linear`;
    fill.style.width = '100%';

    await wait(DUR);
    clearInterval(spinner);

    swapLine.innerHTML = '<span class="g">Success!</span> Received .0238 BTC in 420ms';
    chime();

    fill.style.transition = 'none';
    fill.style.width = '0%';
    fill.offsetWidth;

    await wait(210);
    addLine('View on explorer <span class="d">(tx b6f6...dacc)</span>');
    tick(560, 0.04, 0.038);

    await wait(500);
    mkPrompt('matt');

    await wait(2600);
    run();
  }

  // Start on first user interaction (required for AudioContext on most browsers)
  document.addEventListener('click', () => ac(), { once: true });
  run();
})();
</script>
</body>
</html>

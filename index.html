<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>terminal</title>
<style>
  :root { --sz: 422px; }
  @media (min-width: 1440px) { :root { --sz: 576px; } }
  @media (max-width: 480px)  { :root { --sz: 322px; } }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background: #000;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
  }

  #wrap {
    display: flex; flex-direction: column; align-items: center; gap: 20px;
  }

  #terminal {
    width: var(--sz); height: var(--sz);
    background: #080808;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.06);
    display: flex; flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  #body {
    flex: 1;
    padding: 36px 32px 24px;
    display: flex; flex-direction: column; justify-content: center;
    overflow: hidden;
  }

  #output {
    font-size: 10px;
    line-height: 2.0;
    color: #abb2bf;
    width: 300px;
    margin: 0 auto;
  }

  .line { display: block; }

  .p  { color: #4b5263; }
  .v  { color: #61afef; }
  .m  { color: #5c6370; }
  .d  { color: #3e4451; }
  .g  { color: #56b6c2; }
  .mk { color: #f97316; }

  .cursor {
    display: inline-block;
    width: 5px; height: 12px;
    background: #f97316;
    vertical-align: text-bottom;
    margin-left: 2px;
    animation: blink 1.0s step-end infinite;
  }

  @keyframes blink {
    0%, 49%  { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  #meta {
    font-size: 10px;
    letter-spacing: 0.04em; text-transform: uppercase;
    color: rgba(255,255,255,0.18);
    font-family: 'Geist Mono', 'Menlo', monospace;
  }

  #toggle-bar {
    padding: 0 32px 18px;
    display: flex; align-items: center; justify-content: center;
  }
  .toggle {
    position: relative; display: inline-block;
    width: 26px; height: 14px; cursor: pointer;
  }
  .toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
  .knob {
    position: absolute; inset: 0;
    background: rgba(255,255,255,0.08);
    border-radius: 7px; transition: background 0.2s;
  }
  .knob::before {
    content: ''; position: absolute;
    width: 10px; height: 10px; left: 2px; top: 2px;
    background: rgba(255,255,255,0.22); border-radius: 50%;
    transition: transform 0.18s, background 0.18s;
  }
  .toggle input:checked + .knob { background: rgba(255,255,255,0.18); }
  .toggle input:checked + .knob::before { transform: translateX(12px); background: rgba(255,255,255,0.7); }
</style>
</head>
<body>

<div id="wrap">
  <div id="terminal">
    <div id="body">
      <div id="output"></div>
    </div>
    <div id="toggle-bar">
      <label class="toggle"><input type="checkbox" id="mode-switch"><span class="knob"></span></label>
    </div>
  </div>
  <div id="meta">terminal</div>
</div>

<script>
(() => {
  const out  = document.getElementById('output');
  const meta = document.getElementById('meta');
  let   actx = null;

  const ac = () => {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    return actx;
  };

  function mkNoise(c, dur) {
    const n = Math.ceil(c.sampleRate * dur);
    const buf = c.createBuffer(1, n, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const src = c.createBufferSource(); src.buffer = buf; return src;
  }

  // Keystroke: sharp pop + pitch-dropping sine (percussive thock)
  function keyClick() {
    try {
      const c = ac(), t = c.currentTime;
      const noise = mkNoise(c, 0.005);
      const ng = c.createGain();
      ng.gain.setValueAtTime(0.14, t); ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.006);
      noise.connect(ng); ng.connect(c.destination);
      noise.start(); noise.stop(t + 0.007);
      const osc = c.createOscillator(), og = c.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(300 + Math.random() * 60, t);
      osc.frequency.exponentialRampToValueAtTime(80, t + 0.04);
      osc.connect(og); og.connect(c.destination);
      og.gain.setValueAtTime(0.055, t); og.gain.exponentialRampToValueAtTime(0.0001, t + 0.045);
      osc.start(); osc.stop(t + 0.05);
    } catch (_) {}
  }

  // Enter key: heavier pop + deeper pitch sweep
  function enterClick() {
    try {
      const c = ac(), t = c.currentTime;
      const noise = mkNoise(c, 0.008);
      const ng = c.createGain();
      ng.gain.setValueAtTime(0.22, t); ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.01);
      noise.connect(ng); ng.connect(c.destination);
      noise.start(); noise.stop(t + 0.012);
      const osc = c.createOscillator(), og = c.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(220, t);
      osc.frequency.exponentialRampToValueAtTime(60, t + 0.055);
      osc.connect(og); og.connect(c.destination);
      og.gain.setValueAtTime(0.08, t); og.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
      osc.start(); osc.stop(t + 0.065);
    } catch (_) {}
  }

  // Line reveal: faint tick
  function blip() {
    try {
      const c = ac(), t = c.currentTime;
      const noise = mkNoise(c, 0.004);
      const ng = c.createGain();
      ng.gain.setValueAtTime(0.05, t); ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.005);
      noise.connect(ng); ng.connect(c.destination);
      noise.start(); noise.stop(t + 0.006);
    } catch (_) {}
  }

  // Processing: silent
  function processPulse() {}

  // Success: two clean tones
  function successChime() {
    try {
      const c = ac();
      [[880, 0, 0.12, 0.15], [1108, 0.18, 0.10, 0.18]].forEach(([hz, delay, vol, decay]) => {
        const osc = c.createOscillator(), g = c.createGain();
        osc.type = 'sine'; osc.frequency.value = hz;
        osc.connect(g); g.connect(c.destination);
        const t = c.currentTime + delay;
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
        osc.start(t); osc.stop(t + decay + 0.01);
      });
    } catch (_) {}
  }

  const wait = ms => new Promise(r => setTimeout(r, ms));

  // Cancellable wait — rejects within ms if gen changed
  function waitG(ms, gen) {
    return new Promise((res, rej) => setTimeout(() => runGen === gen ? res() : rej(0), ms));
  }

  function addLine(html = '') {
    const el = document.createElement('span');
    el.className = 'line'; el.innerHTML = html;
    out.appendChild(el);
    return el;
  }

  function mkPrompt(user = 'matt') {
    const el  = document.createElement('span'); el.className = 'line';
    const pr  = document.createElement('span'); pr.className = 'p'; pr.textContent = user + ' › ';
    const cmd = document.createElement('span');
    const cur = document.createElement('span'); cur.className = 'cursor';
    el.appendChild(pr); el.appendChild(cmd); el.appendChild(cur);
    out.appendChild(el);
    return { cmd, cur };
  }

  async function type(cmdEl, text, gen) {
    for (const ch of text) {
      if (runGen !== gen) throw 0;
      cmdEl.textContent += ch;
      keyClick();
      await wait(46 + Math.random() * 62);
    }
  }

  const SPIN = ['⣾','⣽','⣻','⢿','⡿','⣟','⣯','⣷'];

  // Cancellable thinking — interval checks gen every 100ms, rejects fast
  function thinkFor(messages, ms, gen) {
    const line = addLine('');
    const span = document.createElement('span'); line.appendChild(span);
    let si = 0, mi = 0, frames = 0, fpm = 12;
    span.innerHTML = `<span class="v">${SPIN[si]}</span>  <span class="d">${messages[mi]}</span>`;
    return new Promise((res, rej) => {
      const iv = setInterval(() => {
        if (runGen !== gen) { clearInterval(iv); line.remove(); rej(0); return; }
        si = (si + 1) % SPIN.length;
        if (++frames % fpm === 0) mi = (mi + 1) % messages.length;
        span.innerHTML = `<span class="v">${SPIN[si]}</span>  <span class="d">${messages[mi]}</span>`;
      }, 100);
      setTimeout(() => {
        clearInterval(iv);
        line.remove();
        runGen === gen ? res() : rej(0);
      }, ms);
    });
  }

  // Cancellable spinner — resolves with line element, rejects fast on cancel
  function spinFor(label, ms, gen) {
    const line = addLine('');
    const span = document.createElement('span'); line.appendChild(span);
    let si = 0;
    span.innerHTML = `<span class="v">${SPIN[si]}</span> ${label}`;
    return new Promise((res, rej) => {
      const iv = setInterval(() => {
        if (runGen !== gen) { clearInterval(iv); rej(0); return; }
        si = (si + 1) % SPIN.length;
        span.innerHTML = `<span class="v">${SPIN[si]}</span> ${label}`;
      }, 100);
      setTimeout(() => {
        clearInterval(iv);
        runGen === gen ? res(line) : rej(0);
      }, ms);
    });
  }

  let mode = 'reserve';
  let runGen = 0;

  async function sceneDinner(gen) {
    const { cmd, cur } = mkPrompt('matt');
    await waitG(700, gen);
    await type(cmd, 'reserve dinner tonight', gen);
    enterClick(); await waitG(140, gen); cur.remove();

    await thinkFor([
      'red meat: 0 of 1 this week',
      'you hit the gym today',
      'protein\'s the priority',
    ], 3800, gen);

    addLine('<span class="v">House of Prime Rib</span>  <span class="d">0.8mi · Van Ness</span>');
    blip(); await waitG(250, gen);
    addLine('<span class="mk">—</span> <span class="m">why</span>      <span class="v">no red meat this week</span>  <span class="d">(0 / 1 allowed)</span>');
    blip(); await waitG(190, gen);
    addLine('<span class="mk">—</span> <span class="m">table</span>    <span class="v">window · 8:00pm · 2 seats</span>');
    blip(); await waitG(190, gen);
    addLine('<span class="mk">—</span> <span class="m">budget</span>   <span class="v">~$110pp</span>  <span class="d">within your range</span>');
    blip(); await waitG(340, gen);

    const l1 = await spinFor('reserving', 2200, gen);
    l1.innerHTML = '<span class="g">confirmed</span>  8:00pm · table for 2  <span class="d">2.1s</span>';
    successChime(); await waitG(200, gen);
    addLine('view reservation  <span class="d">#R-4829 · Prime Rib</span>');
    blip(); await waitG(500, gen);

    await thinkFor([
      'traffic\'s clear on Van Ness',
      'timing it around your 8pm',
    ], 2200, gen);

    const l2 = await spinFor('scheduling ride', 1000, gen);
    l2.innerHTML = '<span class="g">ride confirmed</span>  <span class="d">1.4s</span>';
    successChime(); await waitG(200, gen);
    addLine('<span class="v">Cybercab</span>  <span class="d">departs 7:40pm · arrives 8:02pm</span>');
    blip(); await waitG(190, gen);
    addLine('view ride  <span class="d">#C-2291 · Tesla</span>');
    blip();
  }

  async function sceneFun(gen) {
    const { cmd, cur } = mkPrompt('matt');
    await waitG(700, gen);
    await type(cmd, 'play golf', gen);
    enterClick(); await waitG(140, gen); cur.remove();

    await thinkFor([
      'checking your week',
      'tallying your stats',
    ], 2600, gen);

    addLine('<span class="mk">—</span> <span class="m">run</span>     <span class="v">52mi</span>  <span class="d">goal 40mi</span>  <span class="g">✓</span>');
    blip(); await waitG(220, gen);
    addLine('<span class="mk">—</span> <span class="m">code</span>    <span class="v">4,820 lines</span>  <span class="g">✓</span>');
    blip(); await waitG(220, gen);
    addLine('<span class="mk">—</span> <span class="m">meals</span>   <span class="v">clean</span>  <span class="d">6 of 7 days</span>  <span class="g">✓</span>');
    blip(); await waitG(360, gen);

    addLine('<span class="mk">top tier unlocked</span>  <span class="d">2 courses available</span>');
    blip(); await waitG(380, gen);

    addLine('<span class="m">The Olympic Club</span>    <span class="d">7mi</span>');
    blip(); await waitG(200, gen);
    addLine('<span class="v">Pebble Beach</span>        <span class="d">32mi</span>  <span class="mk">← best match</span>');
    blip(); await waitG(440, gen);

    const l1 = await spinFor('booking', 2400, gen);
    l1.innerHTML = '<span class="g">confirmed</span>  Pebble Beach · Sat 8:30am  <span class="d">1.8s</span>';
    successChime(); await waitG(200, gen);
    addLine('view booking  <span class="d">#G-2291 · Pebble Beach</span>');
    blip(); await waitG(500, gen);

    const l2 = await spinFor('scheduling ride', 1800, gen);
    l2.innerHTML = '<span class="g">ride confirmed</span>  <span class="d">1.2s</span>';
    successChime(); await waitG(200, gen);
    addLine('<span class="v">Cybercab</span>  <span class="d">departs 7:45am · arrives 8:15am</span>');
    blip(); await waitG(190, gen);
    addLine('view ride  <span class="d">#C-8847 · Tesla</span>');
    blip();
  }

  async function run() {
    const gen = ++runGen;
    out.innerHTML = '';
    try {
      await waitG(700, gen);
      if (mode === 'fun') await sceneFun(gen);
      else await sceneDinner(gen);
      await waitG(500, gen);
      mkPrompt('matt');
      await waitG(2800, gen);
      run();
    } catch(_) {}
  }

  document.getElementById('mode-switch').addEventListener('change', e => {
    mode = e.target.checked ? 'fun' : 'reserve';
    runGen++;
    out.innerHTML = '';
    setTimeout(() => run(), 500);
  });

  document.addEventListener('click', () => ac(), { once: true });

  run();
})();
</script>
</body>
</html>

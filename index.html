<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  :root { --sz: 422px; --fs: 12px; --fs-sm: 11px; }
  @media (min-width: 1440px) { :root { --sz: 576px; --fs: 13px; --fs-sm: 12px; } }
  @media (max-width: 480px)  { :root { --sz: 322px; --fs: 11px; --fs-sm: 10px; } }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background: #000;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    font-family: 'JetBrains Mono', monospace;
  }

  #wrap {
    display: flex; flex-direction: column; align-items: center; gap: 20px;
  }

  #terminal {
    width: var(--sz); height: var(--sz);
    background: #0d0d0d;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.06);
    display: flex; flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  #body {
    flex: 1;
    padding: 36px 32px 24px;
    display: flex; flex-direction: column; justify-content: flex-end;
    overflow: hidden;
  }

  #output {
    font-size: var(--fs);
    line-height: 2.0;
    color: #b0b0b0;
    font-weight: 400;
  }

  .line { display: block; }

  /* Prompt: › instead of % */
  .p  { color: #525252; font-weight: 300; }
  /* Values: teal instead of orange */
  .v  { color: #4ab8c4; }
  /* Labels: muted */
  .m  { color: #6e6e6e; font-weight: 300; }
  /* Dim: very muted */
  .d  { color: #3c3c3c; font-weight: 300; }
  /* Success */
  .g  { color: #52c460; }
  /* Output indent marker */
  .mk { color: #383838; }

  .cursor {
    display: inline-block;
    width: 5.5px; height: calc(var(--fs) + 2px);
    background: #909090;
    vertical-align: text-bottom;
    margin-left: 2px;
    animation: blink 1.0s step-end infinite;
  }

  @keyframes blink {
    0%, 49%  { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  #progress-track { height: 1.5px; flex-shrink: 0; background: rgba(255,255,255,0.04); }
  #progress-fill  { height: 100%; width: 0%; background: #4ab8c4; }

  #meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; font-weight: 300;
    letter-spacing: 0.04em; text-transform: uppercase;
    color: rgba(255,255,255,0.18);
  }
</style>
</head>
<body>

<div id="wrap">
  <div id="terminal">
    <div id="body">
      <div id="output"></div>
    </div>
    <div id="progress-track">
      <div id="progress-fill"></div>
    </div>
  </div>
  <div id="meta">terminal — click to enable audio</div>
</div>

<script>
(() => {
  const out  = document.getElementById('output');
  const fill = document.getElementById('progress-fill');
  const meta = document.getElementById('meta');
  let   actx = null;

  const ac = () => {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    return actx;
  };

  // Crisp noise-based keyboard click
  function keyClick(vol = 0.22) {
    try {
      const c = ac();
      const n = Math.floor(c.sampleRate * 0.007);
      const buf = c.createBuffer(1, n, c.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n) * (1 - i / n);
      const src = c.createBufferSource(); src.buffer = buf;
      const hp  = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2200;
      const g   = c.createGain(); g.gain.value = vol * (0.85 + Math.random() * 0.3);
      src.connect(hp); hp.connect(g); g.connect(c.destination);
      src.start();
    } catch (_) {}
  }

  // Soft blip for output lines
  function blip() {
    try {
      const c = ac(), osc = c.createOscillator(), g = c.createGain();
      osc.connect(g); g.connect(c.destination);
      osc.type = 'sine'; osc.frequency.value = 680 + Math.random() * 80;
      g.gain.setValueAtTime(0.028, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 0.018);
      osc.start(); osc.stop(c.currentTime + 0.02);
    } catch (_) {}
  }

  // Subtle sweep during processing phases
  function processPulse() {
    try {
      const c = ac(), osc = c.createOscillator(), g = c.createGain();
      osc.connect(g); g.connect(c.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(900, c.currentTime);
      osc.frequency.linearRampToValueAtTime(1100, c.currentTime + 0.05);
      g.gain.setValueAtTime(0.025, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 0.07);
      osc.start(); osc.stop(c.currentTime + 0.08);
    } catch (_) {}
  }

  // Bell-like success chime — inharmonic partials give bell character
  function successChime() {
    try {
      const c = ac();
      const base = 523.25;
      const partials = [1, 2.76, 5.40, 8.93]; // bell partial ratios
      const vols    = [0.14, 0.07, 0.04, 0.02];
      const decays  = [1.1,  0.6,  0.3,  0.18];
      partials.forEach((r, i) => {
        const osc = c.createOscillator(), g = c.createGain();
        osc.connect(g); g.connect(c.destination);
        osc.type = 'sine'; osc.frequency.value = base * r;
        const t = c.currentTime;
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(vols[i], t + 0.004);
        g.gain.exponentialRampToValueAtTime(0.0001, t + decays[i]);
        osc.start(t); osc.stop(t + decays[i] + 0.05);
      });
    } catch (_) {}
  }

  const wait = ms => new Promise(r => setTimeout(r, ms));

  function addLine(html = '') {
    const el = document.createElement('span');
    el.className = 'line'; el.innerHTML = html;
    out.appendChild(el);
    return el;
  }

  function mkPrompt(user = 'matt') {
    const el  = document.createElement('span'); el.className = 'line';
    const pr  = document.createElement('span'); pr.className = 'p'; pr.textContent = user + ' › ';
    const cmd = document.createElement('span');
    const cur = document.createElement('span'); cur.className = 'cursor';
    el.appendChild(pr); el.appendChild(cmd); el.appendChild(cur);
    out.appendChild(el);
    return { cmd, cur };
  }

  async function type(cmdEl, text) {
    for (const ch of text) {
      cmdEl.textContent += ch;
      keyClick(0.18 + Math.random() * 0.08);
      await wait(46 + Math.random() * 62);
    }
  }

  // Rotating word stages — not braille
  const STAGES = ['validating', 'routing', 'settling', 'confirming', 'broadcasting'];
  let stageIdx = 0;

  async function run() {
    out.innerHTML = '';
    fill.style.transition = 'none'; fill.style.width = '0%'; fill.offsetWidth;

    await wait(460);
    const { cmd, cur } = mkPrompt('matt');
    await wait(700);

    await type(cmd, 'swap 12h sleep btc');
    keyClick(0.28);
    await wait(140);
    cur.remove();

    addLine('Swap 12h SLEEP for ~0.02856 BTC');
    blip();
    await wait(250);

    addLine('<span class="mk">—</span> <span class="m">rate</span>    <span class="v">1h SLEEP  =  0.00238 BTC</span>  <span class="d">via terminal</span>');
    blip();
    await wait(190);

    addLine('<span class="mk">—</span> <span class="m">fee</span>     <span class="v">$0.69</span>  <span class="d">0.00242h SLEEP</span>');
    blip();
    await wait(190);

    addLine('<span class="mk">—</span> <span class="m">slippage</span>  0.5%  <span class="d">default</span>');
    blip();
    await wait(340);

    // Cycling stage words instead of braille
    const swapLine = addLine('');
    const swapSpan = document.createElement('span'); swapLine.appendChild(swapSpan);
    stageIdx = 0;
    swapSpan.innerHTML = `<span class="d">◌</span> ${STAGES[stageIdx]}`;

    let si = 0;
    const spinner = setInterval(() => {
      si = (si + 1) % STAGES.length;
      swapSpan.innerHTML = `<span class="d">◌</span> ${STAGES[si]}`;
      processPulse();
    }, 540);

    const DUR = 3000;
    await wait(16);
    fill.style.transition = `width ${DUR}ms linear`;
    fill.style.width = '100%';

    await wait(DUR);
    clearInterval(spinner);

    swapLine.innerHTML = '<span class="g">done</span>  received .0238 BTC  <span class="d">420ms</span>';
    successChime();

    fill.style.transition = 'width 280ms ease-out'; fill.style.width = '0%';

    await wait(200);
    addLine('view on explorer  <span class="d">tx b6f6…dacc</span>');
    blip();

    await wait(500);
    mkPrompt('matt');

    await wait(2800);
    run();
  }

  document.addEventListener('click', () => {
    ac();
    meta.textContent = 'terminal — tap anywhere to restart';
  }, { once: true });

  run();
})();
</script>
</body>
</html>
